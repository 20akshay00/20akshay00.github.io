<!-- Added to the <head> of every page (_quarto.yml). A page that sets its own
     include-in-header replaces the site-wide one, so such pages (index, blog,
     tidbits) list this file again next to their own extras. -->
<!-- the robot from the landing page: crisp SVG, a PNG for older browsers, a home-screen icon -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- tints the browser bar on phones to match the navbar -->
<meta name="theme-color" content="#23093f">
<!-- GoatCounter: page-view counts, no cookies (so no consent banner needed) -->
<script data-goatcounter="https://20akshay00.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
